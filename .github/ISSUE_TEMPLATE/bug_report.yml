name: Bug report
description: Report reproducible incorrect behavior in @assetpay/steam-mobile.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve `@assetpay/steam-mobile`.

        Never include passwords, tokens, cookies, API keys, `shared_secret`, `identity_secret`, or other account secrets. Revoke anything that may have been exposed.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication
        - Session and token lifecycle
        - Trade offers
        - Inventories
        - Mobile confirmations
        - Item inspection data
        - HTTP or proxy transport
        - Other
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The exact version returned by your package manager.
      placeholder: "1.0.4"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: "v22.18.0"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample or repository that reproduces the problem, with all secrets replaced.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect the library to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error type, message, HTTP status, or Steam EResult when available.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Remove credentials, tokens, cookies, account identifiers, and personal data before pasting logs.
      render: shell

  - type: dropdown
    id: proxy
    attributes:
      label: Proxy in use
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed all credentials, tokens, cookies, secrets, and personal data.
          required: true
        - label: I tested the latest release, or explained why I could not.
          required: true
